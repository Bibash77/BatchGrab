<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Batch Grab</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><h1>Batch Grab <span><span data-i18n="subtitle"></span></span></h1><p id="source"><span data-i18n="currentPage"></span></p></div><button id="scan"><span data-i18n="scan"></span></button><label class="language-control"><span data-i18n="language"></span><select id="language" aria-label="" data-i18n-aria-label="language"><option value="en">English</option><option value="ja">日本語</option></select></label></header><aside id="onboarding"><span data-i18n="firstRun"></span><button id="dismissIntro" data-i18n="gotIt"></button></aside>
<nav id="views" aria-label="" data-i18n-aria-label="views"><button data-view="recommended" aria-pressed="true"><span data-i18n="suggested"></span></button><button data-view="images"><span data-i18n="images"></span></button><button data-view="documents"><span data-i18n="documents"></span></button><button data-view="review"><span data-i18n="review"></span></button><button data-view="assets"><span data-i18n="assets"></span></button><button data-view="all"><span data-i18n="allFiles"></span></button></nav>
<div class="toolbar"><input id="text" type="search" placeholder="" data-i18n-placeholder="search" aria-label="" data-i18n-aria-label="searchFiles"><button id="advancedToggle" aria-expanded="false" aria-controls="advanced"><span data-i18n="options"></span></button></div>
<section id="advanced" hidden aria-label="" data-i18n-aria-label="advanced"><p class="hint"><span data-i18n="scannerHint"></span></p><label><input id="extendedScan" type="checkbox"> <span data-i18n="extended"></span></label><p class="hint"><span data-i18n="extendedHint"></span></p><div id="groups" class="groups"></div><div class="row"><label><span data-i18n="minWidth"></span><input id="minw" type="number" min="0" value="0"></label><label><span data-i18n="regex"></span><input id="regex" type="text" placeholder="/pattern/i" aria-label="" data-i18n-aria-label="regexLabel"></label></div><div class="row"><label><span data-i18n="rootFolder"></span><input id="folder" value="Batch Grab" type="text"></label><label><span data-i18n="template"></span><input id="pattern" value="{name}" type="text"></label><button id="template"><span data-i18n="applyTemplate"></span></button></div><p class="hint"><span data-i18n="tokens"></span></p><button id="smart" class="link"><span data-i18n="restoreNames"></span></button><details><summary id="previewCount"><span data-i18n="paths"></span></summary><ol id="preview"></ol><p class="hint"><span data-i18n="suffixHint"></span></p></details><button id="forgetScan" class="link" data-i18n="forgetScan"></button></section>
<div class="selection"><p id="count" aria-live="polite"><span data-i18n="scanning"></span></p><button id="all" class="link"><span data-i18n="selectMatching"></span></button><button id="pageSelect" class="link"><span data-i18n="selectPage"></span></button><button id="none" class="link"><span data-i18n="clear"></span></button></div>
<main id="scroller"><ul id="list" aria-label="" data-i18n-aria-label="found"></ul><p id="empty" hidden></p><button id="resetFilters" hidden data-i18n="reset"></button></main>
<div class="pager"><button id="prev"><span data-i18n="previous"></span></button><span id="pageInfo"></span><button id="next"><span data-i18n="next"></span></button></div>
<details id="outcomes"><summary id="queueSummary"><span data-i18n="outcomes"></span></summary><div class="row"><button id="failedOnly" class="link"><span data-i18n="failures"></span></button><button id="exportIndex" class="link"><span data-i18n="export"></span></button><button id="downloads" class="link"><span data-i18n="chromeDownloads"></span></button><button id="clearFinished" class="link"><span data-i18n="clearHistory"></span></button></div><ul id="jobs"></ul><p id="historyNote" class="hint"></p></details>
<footer><div class="action"><span id="selectedCount"><span data-i18n="noneSelected"></span></span><button id="go" class="primary" disabled><span data-i18n="download"></span></button></div><p id="status" role="status"><span data-i18n="initial"></span></p></footer>
<script type="module" src="popup.js"></script></body></html>
